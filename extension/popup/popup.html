<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus ASTU CP Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #0f1117;
      color: #e2e8f0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #1a1f2e;
      border-bottom: 1px solid #2d3748;
    }

    .header img { width: 28px; height: 28px; border-radius: 6px; }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .header p {
      font-size: 11px;
      color: #718096;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #141824;
      border-bottom: 1px solid #2d3748;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a5568;
      flex-shrink: 0;
    }

    .dot.connected { background: #48bb78; }
    .dot.error     { background: #fc8181; }
    .dot.checking  { background: #ecc94b; animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    #status-text { color: #a0aec0; }

    .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #718096;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #4299e1; }

    .hint {
      font-size: 11px;
      color: #4a5568;
      margin-top: 4px;
    }

    .hint a { color: #4299e1; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-save { background: #3182ce; color: #fff; }
    #btn-test { background: #2d3748; color: #e2e8f0; }

    .queue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #1a1f2e;
      border-radius: 6px;
      font-size: 12px;
      color: #718096;
    }

    #btn-flush { font-size: 11px; padding: 4px 8px; flex: none; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #2d3748;
      font-size: 11px;
      color: #4a5568;
      text-align: center;
    }

    .footer a { color: #4299e1; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="logo" onerror="this.style.display='none'" />
    <div>
      <h1>Focus ASTU CP Hub</h1>
      <p>Auto-capture your accepted solutions</p>
    </div>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">Not configured</span>
  </div>

  <div class="body">
    <div>
      <label for="portal-url">Portal URL</label>
      <input
        type="text"
        id="portal-url"
        placeholder="https://focus-astu-backend.purplebeach-cef0511d.southafricanorth.azurecontainerapps.io"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div>
      <label for="api-key">API Key</label>
      <input
        type="password"
        id="api-key"
        placeholder="Paste your API key here"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="hint">
        Get your key from
        <a href="#" id="settings-link" target="_blank">/settings/extension</a>
        on the portal.
      </p>
    </div>

    <div class="actions">
      <button id="btn-save">Save</button>
      <button id="btn-test">Test connection</button>
    </div>

    <div class="queue-row">
      <span id="queue-label">Queued: 0 submissions</span>
      <button id="btn-flush" style="background:#2d3748;color:#e2e8f0;">Retry now</button>
    </div>
  </div>

  <div class="footer">
    LeetCode &amp; Codeforces auto-capture enabled &mdash;
    <a href="https://codeforces.com" target="_blank">open Codeforces</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
